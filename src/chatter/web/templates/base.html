<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Chatter Admin{% endblock %}</title>
    <!-- Tailwind CSS + DaisyUI via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2"></script>
    <style>
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .glass-card { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="min-h-screen bg-base-300">
    <!-- Navbar -->
    <div class="navbar bg-base-100 shadow-lg border-b border-base-content/10">
        <div class="navbar-start">
            <a href="/" class="btn btn-ghost text-xl font-bold tracking-tight">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
                </svg>
                Chatter
            </a>
        </div>
        <div class="navbar-center">
            <ul class="menu menu-horizontal px-1 gap-1">
                <li><a href="/" class="{% if page == 'dashboard' %}active{% endif %}">Dashboard</a></li>
                <li><a href="/memory" class="{% if page == 'memory' %}active{% endif %}">Memory</a></li>
                <li><a href="/soul" class="{% if page == 'soul' %}active{% endif %}">Soul</a></li>
                <li><a href="/tools" class="{% if page == 'tools' %}active{% endif %}">Tools</a></li>
                <li><a href="/conversations" class="{% if page == 'conversations' %}active{% endif %}">Conversations</a></li>
                <li><a href="/settings" class="{% if page == 'settings' %}active{% endif %}">Settings</a></li>
            </ul>
        </div>
        <div class="navbar-end">
            <div class="badge badge-success gap-1">
                <div class="w-2 h-2 rounded-full bg-success animate-pulse"></div>
                Online
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8 max-w-7xl">
        {% block content %}{% endblock %}
    </main>

    <!-- Toast container for HTMX notifications -->
    <div id="toast-container" class="toast toast-end"></div>
</body>
</html>
